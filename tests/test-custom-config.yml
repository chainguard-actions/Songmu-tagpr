name: Test tagpr action with custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the workspace
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a tagpr config file
        run: |
          cat > "$GITHUB_WORKSPACE/tagpr-test.toml" <<'EOF'
          [tagpr]
          versionFile = ""
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          config: tagpr-test.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with custom config (installed tagpr and ran, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag }}
          PULL_REQUEST: ${{ steps.action.outputs.pull_request }}
          BASE_TAG: ${{ steps.action.outputs.base_tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag: $TAG"
          echo "pull_request: $PULL_REQUEST"
          echo "base_tag: $BASE_TAG"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
