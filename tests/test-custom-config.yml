name: Test tagpr with custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and create a tagpr config file
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a custom tagpr config file
          cat > "$GITHUB_WORKSPACE/.tagpr-custom" <<'EOF'
          [tagpr]
          versionFile = ""
          EOF
          echo "Custom config file created at $GITHUB_WORKSPACE/.tagpr-custom"

      - id: action
        uses: .
        with:
          version: v1.21.0
          config: .tagpr-custom
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable, but config was accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
