name: Test apply mode with an invalid plan fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: apply
          plan: 'this-is-not-valid-json'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action failed without producing a tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag: $TAG"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected apply mode with an invalid plan to fail"
            exit 1
          fi
          if [ -n "$TAG" ]; then
            echo "FAIL: no tag should be produced"
            exit 1
          fi
          echo "PASS"
