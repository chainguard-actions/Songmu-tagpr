name: Test tagpr action with custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake curl that records the version argument
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bin"
          # Write a curl that records the version passed to install.sh
          cat > "$GITHUB_WORKSPACE/.bin/curl" << 'CURLEOF'
          #!/bin/sh
          FAKE_INSTALL="$GITHUB_WORKSPACE/tests/fixtures/fake-install.sh"
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *tagpr*install.sh*)
              if [ -n "$out" ]; then
                cat "$FAKE_INSTALL" > "$out"
              else
                cat "$FAKE_INSTALL"
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          chmod +x "$GITHUB_WORKSPACE/.bin/curl"
          echo "$GITHUB_WORKSPACE/.bin" >> "$GITHUB_PATH"

      - name: Write version-recording fake tagpr wrapper
        run: |
          # Override fake-install.sh to record the version
          mkdir -p "$GITHUB_WORKSPACE/.tagpr-test"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fake-install-version.sh" << 'EOF'
          #!/bin/sh
          BINDIR=""
          VERSION=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -b)
                BINDIR="$2"
                shift 2
                ;;
              *)
                VERSION="$1"
                shift
                ;;
            esac
          done
          if [ -z "$BINDIR" ]; then
            BINDIR="/usr/local/bin"
          fi
          # Record the version that was requested
          echo "$VERSION" > "$GITHUB_WORKSPACE/.tagpr-test/installed-version"
          cat > "${BINDIR}/tagpr" << 'TAGPREOF'
          #!/bin/sh
          echo "tagpr: running (fake version-recording)"
          if [ -n "$GITHUB_OUTPUT" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "pull_request=" >> "$GITHUB_OUTPUT"
            echo "base_tag=" >> "$GITHUB_OUTPUT"
          fi
          exit 0
          TAGPREOF
          chmod +x "${BINDIR}/tagpr"
          EOF
          chmod +x "$GITHUB_WORKSPACE/tests/fixtures/fake-install-version.sh"
          # Point fake curl at the version-recording install script
          cat > "$GITHUB_WORKSPACE/.bin/curl" << 'CURLEOF2'
          #!/bin/sh
          FAKE_INSTALL="$GITHUB_WORKSPACE/tests/fixtures/fake-install-version.sh"
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *tagpr*install.sh*)
              if [ -n "$out" ]; then
                cat "$FAKE_INSTALL" > "$out"
              else
                cat "$FAKE_INSTALL"
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF2
          chmod +x "$GITHUB_WORKSPACE/.bin/curl"

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.0.0"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert custom version was passed to installer
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Check if the version file was written (only if install ran)
          if [ -f "$GITHUB_WORKSPACE/.tagpr-test/installed-version" ]; then
            INSTALLED_VERSION="$(cat "$GITHUB_WORKSPACE/.tagpr-test/installed-version")"
            echo "installed version: $INSTALLED_VERSION"
            if [ "$INSTALLED_VERSION" = "v1.0.0" ]; then
              echo "PASS: correct version v1.0.0 was installed"
            else
              echo "FAIL: expected version v1.0.0 but got '$INSTALLED_VERSION'"
              exit 1
            fi
          else
            echo "INFO: version file not found (install may have been skipped or failed)"
          fi
