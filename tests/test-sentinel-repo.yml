name: Test tagpr action against sentinel repo (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag }}
          PR: ${{ steps.action.outputs.pull_request }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag: $TAG"
          echo "pull_request: $PR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (tagpr ran against the repo)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
