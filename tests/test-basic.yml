name: Test basic usage - install and run tagpr
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran (installed tagpr and attempted to run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG_OUTPUT: ${{ steps.action.outputs.tag }}
          PR_OUTPUT: ${{ steps.action.outputs.pull_request }}
          BASE_TAG_OUTPUT: ${{ steps.action.outputs.base_tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag output: $TAG_OUTPUT"
          echo "pull_request output: $PR_OUTPUT"
          echo "base_tag output: $BASE_TAG_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable by tagpr)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
