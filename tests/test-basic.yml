name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git user and set up mock curl
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a fake install.sh that installs a stub tagpr binary
          cat > /tmp/fake-install-tagpr.sh << 'INSTALLEOF'
          #!/bin/sh
          # Fake tagpr install script
          # Parse -b <bindir> and version args
          BINDIR=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -b) BINDIR="$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          if [ -z "$BINDIR" ]; then
            BINDIR="/usr/local/bin"
          fi
          mkdir -p "$BINDIR"
          cat > "$BINDIR/tagpr" << 'BINARYEOF'
          #!/bin/sh
          echo "tagpr stub: would run tagpr here"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          # Exit 0 to simulate successful install; tagpr itself would need a real repo
          exit 0
          BINARYEOF
          chmod +x "$BINDIR/tagpr"
          echo "tagpr stub installed to $BINDIR/tagpr"
          INSTALLEOF
          chmod +x /tmp/fake-install-tagpr.sh

          # Create a fake curl that intercepts tagpr install.sh URL
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *Songmu/tagpr*install.sh*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-tagpr.sh > "$out"
              else
                cat /tmp/fake-install-tagpr.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          chmod +x /tmp/fake-bin/curl
          echo "Mock curl installed"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - name: Assert tagpr was installed and ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag }}
          PR: ${{ steps.action.outputs.pull_request }}
          BASE_TAG: ${{ steps.action.outputs.base_tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag: $TAG"
          echo "pull_request: $PR"
          echo "base_tag: $BASE_TAG"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: tagpr stub ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: tagpr failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
