name: Test basic usage (auto mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag }}
          PR: ${{ steps.action.outputs.pull_request }}
          BASE_TAG: ${{ steps.action.outputs.base_tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag: $TAG"
          echo "pull_request: $PR"
          echo "base_tag: $BASE_TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$PR" ] && ! echo "$PR" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
              echo "FAIL: pull_request output is not valid JSON"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
